[project]
name = "investment-tracker"
version = "0.2.0"
description = "Dashboard locale per seguire il rendimento dei propri investimenti con i dati di Yahoo Finance."
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "requests>=2.31",
    # Pinnato: numpy >=2.5 viene bloccato da AppLocker/WDAC su questa macchina
    # (DLL "bloccata da un criterio di controllo dell'applicazione").
    "numpy==2.1.3",
]

[project.scripts]
investment-tracker = "investment_tracker.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["investment_tracker"]
