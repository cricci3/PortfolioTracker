[project]
name = "investment-tracker"
version = "0.3.0"
description = "Local dashboard to track your investment returns with Yahoo Finance data."
requires-python = ">=3.10"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "requests>=2.31",
    # Pinned: numpy >=2.5 is blocked by AppLocker/WDAC on this machine
    # (DLL "blocked by an application control policy").
    "numpy==2.1.3",
]

[project.scripts]
investment-tracker = "investment_tracker.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["investment_tracker"]
